<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMT SYSTEM - WEB TERMINAL</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
            border: 1px solid #00ff00;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            background: #050505;
        }
        h2 {
            text-align: center;
            color: #00ff66;
            margin-top: 5px;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.6);
        }
        
        /* Navigation Tabs */
        .tab-menu {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid #00ff00;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #111;
            color: #00ff00;
            border: 1px solid #00ff00;
            border-bottom: none;
            cursor: pointer;
            font-weight: bold;
            font-family: monospace;
            text-align: center;
        }
        .tab-btn.active {
            background: #00ff00;
            color: #000;
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 3px;
            color: #00cc00;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 8px;
            background: #111;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: monospace;
            box-sizing: border-box;
        }
        .action-btn {
            width: 100%;
            padding: 10px;
            background: #00ff00;
            color: #000;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            font-family: monospace;
        }
        #console {
            margin-top: 10px;
            background: #000;
            border: 1px dashed #00ff00;
            padding: 8px;
            height: 220px;
            overflow-y: scroll;
            font-size: 12px;
        }
        .log-item {
            margin-bottom: 4px;
            border-bottom: 1px solid #111;
        }

        /* Facebook Panel */
        .fb-panel {
            text-align: center;
            padding: 10px;
        }
        .fb-link-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: monospace;
        }
        .btn-fb { background: #1877f2; }
        .btn-login { background: #42b72a; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔐 KMT SYSTEM 🔐</h2>
    
    <!-- Tab Navigation Bar -->
    <div class="tab-menu">
        <div class="tab-btn active" onclick="switchTab('tool-tab', this)">[1] TOOL MAIN</div>
        <div class="tab-btn" onclick="switchTab('fb-tab', this)">[2] FB LINKS</div>
    </div>

    <!-- TAB 1: KMT Tool Main Panel -->
    <div id="tool-tab" class="tab-content active">
        <div class="form-group">
            <label>[?] ENTER YOUR KEY:</label>
            <input type="text" id="key" value="KMT" placeholder="Enter key...">
        </div>
        
        <div class="form-group">
            <label>[★] LIMIT COUNT:</label>
            <input type="number" id="limit" value="5" placeholder="Number of IDs...">
        </div>

        <button class="action-btn" onclick="startTool()">[>] START TOOL</button>

        <div id="console">
            <div style="color: #666;">[System Ready. Waiting for execution...]</div>
        </div>
    </div>

    <!-- TAB 2: Facebook Quick Links Panel -->
    <div id="fb-tab" class="tab-content">
        <div class="fb-panel">
            <label style="color: #00ffcc; margin-bottom: 15px;">[🌐] FACEBOOK DIRECT ACCESS:</label>
            <a href="https://m.facebook.com" class="fb-link-btn btn-fb">[+] Open Mobile Facebook</a>
            <a href="https://www.facebook.com/login" class="fb-link-btn btn-login">[+] Open Facebook Login</a>
            <div style="font-size: 11px; color: #888; margin-top: 10px;">
                (Note: Switch back to [1] TOOL MAIN anytime without clearing system state.)
            </div>
        </div>
    </div>
</div>

<script>
    // Tab switching functionality
    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(tab => {
            tab.classList.remove('active');
        });
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
        });

        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');
    }

    // Tool execution script
    function startTool() {
        const key = document.getElementById('key').value;
        const limit = document.getElementById('limit').value;
        const consoleBox = document.getElementById('console');

        consoleBox.innerHTML = '<div style="color: yellow;">[~] Connecting to KMT Server...</div>';

        fetch('/run_tool', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ key: key, limit: limit })
        })
        .then(response => response.json())
        .then(data => {
            consoleBox.innerHTML = '';
            if (data.status === 'error') {
                consoleBox.innerHTML = `<div style="color: red;">${data.message}</div>`;
                return;
            }

            data.results.forEach(res => {
                let item = document.createElement('div');
                item.className = 'log-item';
                item.style.color = '#00ff41';
                item.innerText = res.text;
                consoleBox.appendChild(item);
            });
        })
        .catch(err => {
            consoleBox.innerHTML = `<div style="color: red;">[×] Connection Error!</div>`;
        });
    }
</script>

</body>
</html>
