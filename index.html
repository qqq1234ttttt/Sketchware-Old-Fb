<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMT SYSTEM - WEB TERMINAL</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
            border: 1px solid #00ff00;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            background: #050505;
        }
        h2 {
            text-align: center;
            color: #00ff66;
            margin-top: 5px;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.6);
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 3px;
            color: #00cc00;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 8px;
            background: #111;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: monospace;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #00ff00;
            color: #000;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover {
            background: #00cc00;
        }
        #console {
            margin-top: 10px;
            background: #000;
            border: 1px dashed #00ff00;
            padding: 8px;
            height: 150px;
            overflow-y: scroll;
            font-size: 12px;
        }
        .log-item {
            margin-bottom: 4px;
            border-bottom: 1px solid #111;
        }
        /* Facebook Tester Section */
        .fb-section {
            margin-top: 15px;
            border-top: 1px dashed #00ff00;
            padding-top: 10px;
        }
        .fb-container {
            width: 100%;
            height: 220px;
            background: #fff;
            border: 1px solid #00ff00;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔐 KMT SYSTEM 🔐</h2>
    <div style="text-align: center; font-size: 11px; margin-bottom: 10px;">>>> KYAW MIN TUN TOOL <<<</div>
    
    <div class="form-group">
        <label>[?] ENTER YOUR KEY:</label>
        <input type="text" id="key" value="KMT" placeholder="Enter key...">
    </div>
    
    <div class="form-group">
        <label>[★] LIMIT COUNT:</label>
        <input type="number" id="limit" value="5" placeholder="Number of IDs...">
    </div>

    <button onclick="startTool()">[>] START TOOL</button>

    <div id="console">
        <div style="color: #666;">[System Ready. Waiting for execution...]</div>
    </div>

    <!-- Facebook Website Testing Section -->
    <div class="fb-section">
        <label style="color: #00ffcc;">[🌐] FACEBOOK LIVE TESTER (WEB VIEW):</label>
        <div style="margin-bottom: 5px; font-size: 11px;">
            <a href="https://m.facebook.com" target="fb_frame" style="color: #00ff00; text-decoration: none; margin-right: 15px;">[Open m.facebook]</a>
            <a href="https://www.facebook.com/login" target="fb_frame" style="color: #00ff00; text-decoration: none;">[Open Login]</a>
        </div>
        <!-- Facebook ကို iframe နဲ့ တိုက်ရိုက်ထည့်ထားခြင်း -->
        <iframe name="fb_frame" src="https://m.facebook.com" class="fb-container"></iframe>
    </div>
</div>

<script>
    function startTool() {
        const key = document.getElementById('key').value;
        const limit = document.getElementById('limit').value;
        const consoleBox = document.getElementById('console');

        consoleBox.innerHTML = '<div style="color: yellow;">[~] Connecting to KMT Server...</div>';

        fetch('/run_tool', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ key: key, limit: limit })
        })
        .then(response => response.json())
        .then(data => {
            consoleBox.innerHTML = '';
            if (data.status === 'error') {
                consoleBox.innerHTML = `<div style="color: red;">${data.message}</div>`;
                return;
            }

            data.results.forEach(res => {
                let item = document.createElement('div');
                item.className = 'log-item';
                item.style.color = '#00ff41';
                item.innerText = res.text;
                consoleBox.appendChild(item);
            });
        })
        .catch(err => {
            consoleBox.innerHTML = `<div style="color: red;">[×] Connection Error!</div>`;
        });
    }
</script>

</body>
</html>
